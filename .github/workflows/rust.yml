name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Lets the three-platform check be re-run on demand, without pushing a commit
  # or opening a pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: Formatting
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - run: cargo +nightly fmt -- --check

  check:
    name: Check
    # Runs for pull requests and manual dispatches, but not for pushes: a push
    # to main already builds every platform in the `build` job.
    if: github.event_name != 'push'
    needs: fmt
    permissions: {}
    uses: ./.github/workflows/build.yml
    with:
      check-only: true

  build:
    name: Build
    if: github.event_name == 'push'
    needs: fmt
    permissions: {}
    uses: ./.github/workflows/build.yml
    with:
      version-suffix: "-beta"
      upload-artifacts: true